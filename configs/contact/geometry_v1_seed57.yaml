experiment:
  name: contact_geometry_v1
  save_checkpoint_every: 2000
  n_epochs: 20000000
  max_iter: 60000

runner:
  postcvpr:
    warmup_steps: 100
    optimizer:
      lr: 5e-5
      decay_steps: 50_000
      decay_rate: 5e-1
    material:
      lame_mu_min: 15909
      lame_mu_max: 63636
      lame_lambda_min: 3535.414406069427
      lame_lambda_max: 93333.73508005822
      bending_coeff_min: 6.370782056371576e-08
      bending_coeff_max: 0.0013139737991266374
      density_min: 4.34e-2
      density_max: 7e-1

dataloader:
  num_workers: 0
  batch_size: 1
  pyg_data: True
  dataset:
    postcvpr:
      data_root: 'vto_dataset/smpl_parameters'
      smpl_model: 'smpl/SMPL_FEMALE.pkl'
      garment_dict_file: 'garments_dict.pkl'
      obstacle_dict_file: 'smpl_aux.pkl'
      split_path: 'datasplits/train.csv'
      lookup_steps: 5
      pinned_verts: True
      random_betas: True
      betas_scale: 3.
      n_coarse_levels: 3

criterions:
  postcvpr.mataug.stretching_energy:
  postcvpr.inertia:
  postcvpr.gravitational_energy:
    z_axis: 1
  postcvpr.collision_penalty:
    contact_geometry: signed_mesh
    point_chunk: 256
    face_chunk: 2048
    min_triangle_area: 1e-12
    weight_start: 5e+3
    weight_max: 5e+5
    eps: 2e-3
    start_rampup_iteration: 50000
    n_rampup_iterations: 100000
  postcvpr.mataug.bending_energy:
  postcvpr.friction_energy:
    mu: 0.5
    friction_radius: 3e-3

model:
  postcvpr:
    core_model: 'postcvpr'
    architecture: "f,c0|f,c0|f,c0|d:c0,c1|c0,c1|c0,c1|d:c1|c1|c1|u:c0,c1|c0,c1|c0,c1|u:f,c0|f,c0|f,c0"
    collision_radius: 3e-2
    k_world_edges: 1
    n_coarse_levels: 3

device: 'cuda:0'

seed: 57
mode: train
recording:
  require_clean: true
  tensorboard: true
validation:
  enabled: true
  contact_geometry_metrics: true
  every: 5000
  seed: 12345
  n_steps: 120
  save_rollouts: true
  split_kind: held_out_motion
  sequences:
    - {id: tshirt_shape00_01_01, garment: tshirt}
    - {id: tshirt_shape00_07_02, garment: tshirt}
    - {id: tshirt_shape00_104_54, garment: tshirt}
  material:
    density: 0.20022
    lame_mu: 23600.0
    lame_lambda: 44400.0
    bending_coeff: 3.9625778333333325e-05
